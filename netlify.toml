# elliotroth.me — static files served straight from the repository root.
# There is nothing to build: no bundler, no dependencies, no framework.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    # The page loads no inline scripts at all, so script-src stays at 'self'.
    # style-src needs 'unsafe-inline' because render.js writes style attributes
    # and the culture toast is positioned via cssText. Google Fonts supplies the
    # stylesheet (fonts.googleapis.com) and the font files (fonts.gstatic.com).
    # img-src needs data: for the inline SVG favicon.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"

# The corpus is what the curator agent rewrites. Never let a CDN or a browser
# serve a stale copy — a passage should be visible on the next reload.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Asset filenames are not content-hashed, so they cannot be cached immutably.
# Ten minutes at the edge, revalidated after that.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
